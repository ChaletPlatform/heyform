networks:
  heyform-net:

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - heyform-net
    depends_on:
      - heyform

  heyform:
    image: ghcr.io/chaletplatform/heyform:latest
    restart: unless-stopped
    depends_on:
      - keydb
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9157/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    env_file:
      - .env
    environment:
      APP_HOMEPAGE_URL: ${APP_HOMEPAGE_URL}
      SESSION_KEY: ${SESSION_KEY:?SESSION_KEY is required}
      FORM_ENCRYPTION_KEY: ${FORM_ENCRYPTION_KEY:?FORM_ENCRYPTION_KEY is required}
      MONGO_URI: ${MONGO_URI}
      REDIS_HOST: keydb
      REDIS_PORT: 6379
      SMTP_FROM: ${SMTP_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_IGNORE_CERT: ${SMTP_IGNORE_CERT:-false}
    volumes:
      - ./assets:/app/packages/server/static/upload
      - ./assets:/app/packages/server/uploads
    networks:
      - heyform-net

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      # Web UI only accessible from localhost — use SSH tunnel to view: ssh -L 8025:localhost:8025 heyform-instance
      - "127.0.0.1:8025:8025"
    networks:
      - heyform-net

  keydb:
    image: eqalpha/keydb:latest
    restart: unless-stopped
    command: keydb-server --appendonly yes --protected-mode no
    volumes:
      - keydb_data:/data
    networks:
      - heyform-net

volumes:
  keydb_data:
  caddy_data:
  caddy_config:
