packages:
  - 'packages/server'
  - 'packages/webapp'
  - 'packages/form-renderer'

allowBuilds:
  '@apollo/protobufjs': set this to true or false
  '@nestjs/core': set this to true or false
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  bcrypt: set this to true or false
  esbuild: set this to true or false
  sharp: set this to true or false
  simple-git-hooks: set this to true or false

onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@swc/core'
  - bcrypt
  - core-js
  - esbuild
  - protobufjs
  - sharp
  - simple-git-hooks
  - unrs-resolver
